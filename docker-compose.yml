services:
  churn-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-scoring-service
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./visualizations:/app/visualizations
    restart: unless-stopped